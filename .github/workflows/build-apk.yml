name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - jules-2555869236949869192-e9ce5460

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Clean Stale Build Caches
        run: |
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf .gradle
          rm -rf build

      - name: Build Debug APK with Flutter
        run: flutter build apk --debug

      - name: Locate and Verify Debug APK
        id: locate_apk
        run: |
          APK_PATH=$(find build/ -type f -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*.apk" | grep -i "debug" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK file found after Flutter build."
            false
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
