name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Android SDK & Local Properties
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper..."
            cd android
            gradle wrapper --gradle-version 8.14
            cd ..
          fi
          chmod +x android/gradlew
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Clean Stale Build Caches
        run: |
          rm -rf android/.gradle
          rm -rf android/app/build
          rm -rf .gradle
          rm -rf build

      - name: Build Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            ./gradlew assembleDebug --stacktrace --no-daemon
          elif [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "::error::Android project directory or Gradle wrapper missing."
            false
          fi

      - name: Locate and Verify Debug APK
        id: locate_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No debug APK file found after Gradle build."
            false
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
