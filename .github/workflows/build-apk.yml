name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Validate Android Project & Gradle Wrapper
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "::error::Android project root or settings.gradle(.kts) not found!"
            exit 1
          fi
          if [ ! -d "app" ]; then
            echo "::error::Application module 'app' directory not found!"
            exit 1
          fi
          if [ ! -f "gradlew" ]; then
            echo "::error::Gradle wrapper 'gradlew' not found!"
            exit 1
          fi
          chmod +x gradlew

      - name: 4. Remove Stale Caches
        run: |
          echo "Removing stale .gradle and build caches..."
          rm -rf .gradle app/build

      - name: 5. Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 6. Locate and Verify APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Generated debug APK could not be found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
